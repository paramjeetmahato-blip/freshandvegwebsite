<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Fresh & Veg</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>

<header class="site-header">
    <div class="container header-container">
        <a href="index.html" class="logo">fresh<span>&</span>veg</a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<section class="all-products-section">
    <div class="container">

        <div class="section-heading">
            <h2>Complete Your Order</h2>
            <p>Enter your delivery information.</p>
        </div>

        <form id="checkoutForm">

            <h3>Customer Information</h3>

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Mobile Number</label>
            <input type="tel" name="phone" placeholder="Enter 10 digit mobile number"
                   pattern="[0-9]{10}" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email">

            <h3>Delivery Address</h3>

            <label>House / Street Address</label>
            <textarea name="address" placeholder="Enter your full address" required></textarea>

            <label>City</label>
            <input type="text" name="city" placeholder="Enter city" required>

            <label>State</label>
            <input type="text" name="state" placeholder="Enter state" required>

            <label>PIN Code</label>
            <input type="text" name="pincode" pattern="[0-9]{6}"
                   placeholder="Enter 6 digit PIN code" required>

            <h3>Payment Method</h3>

            <label>
                <input type="radio" name="payment" value="COD" required>
                Cash on Delivery
            </label>

            <label>
                <input type="radio" name="payment" value="Online">
                Online Payment
            </label>

            <button type="submit">Place Order</button>

        </form>

    </div>
</section>

<footer class="site-footer">
    <div class="container">
        <p>© 2026 Fresh & Veg. All Rights Reserved.</p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
