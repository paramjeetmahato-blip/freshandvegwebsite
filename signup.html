<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Fresh & Veg</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>

<header class="site-header">
    <div class="container header-container">
        <a href="index.html" class="logo">fresh<span>&</span>veg</a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<section class="all-products-section">
    <div class="container">

        <div class="section-heading">
            <h2>Create Your Account</h2>
            <p>Join Fresh & Veg today.</p>
        </div>

        <form id="signupForm">

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Mobile Number</label>
            <input type="tel" name="phone" pattern="[0-9]{10}"
                   placeholder="Enter 10 digit mobile number" required>

            <label>Password</label>
            <input type="password" name="password" minlength="8"
                   placeholder="Create password (minimum 8 characters)" required>

            <label>Confirm Password</label>
            <input type="password" name="confirmPassword"
                   placeholder="Confirm your password" required>

            <button type="submit">Create Account</button>

            <p>Already have an account?
                <a href="login.html">Login Here</a>
            </p>

        </form>

    </div>
</section>

<footer class="site-footer">
    <div class="container">
        <p>© 2026 Fresh & Veg. All Rights Reserved.</p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
